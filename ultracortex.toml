# UltraCortex v1.0 — node configuration.
# Merge order: this file ← UC_* environment variables ← `--set key=value`.
# Every value below is the default; a missing file boots identically.

[node]
id = "ultracortex-0"
data_dir = "./ultracortex-data"
# WAL shards; default max(2, cores - 2). Renumbering after first boot is
# safe (sharding is by handle hash), shrinking is not.
shards = 2
# Root of all seed-derived randomness (ULIDs, probes, judge tie-breaks).
# Fixed seed + same envelope stream = byte-identical state (replay).
boot_seed = 5462438252926
# Feature-hash embedder dimensionality for VectorCell/RerankerCell.
embedder_dim = 256

[persist]
# T0 = plaintext (dev), T1 = node-key sealed values, T2 = per-stream keys +
# batch-signed CrossCheckLedger, T3 = locally persisted rotating keyring.
encryption_tier = "T1"

[listen]
# Preferred transport: Unix socket, chmod 0600. Empty string disables.
uds = ""            # default: <data_dir>/ultracortex.sock
# Opt-in TCP for tooling without UDS. Loopback only by policy.
tcp = ""            # e.g. "127.0.0.1:7741"

[curator]
# Librarian↔Warden agreement band over the rolling 200-audit window.
# Above 0.99 → suspicious_agreement (collusion tripwire, probe rate ×10).
# Below quota_low → miscalibration.
disagreement_quota_low = 0.92
disagreement_quota_high = 0.97
# Adversarial probe rate (fabricated-handle audits the Warden must catch).
probe_rate = 0.001
# Fraction of passed audits re-run blind with permuted evidence order.
blind_reaudit_rate = 0.01
# Supported KV-cache planning profile. `reference` is the v1.0 default
# (Librarian 384 MiB, Warden 384 MiB, Adjudicator 256 MiB).
kv_budget_profile = "reference"
# Rotating adjudication pool (judge = pool[envelope.seed % len]).
pool = "phi-3.5-mini, llama-3.2-3b, smollm2-1.7b"
# Production Curator defaults require a local llama.cpp-style CLI and the
# SHA-pinned GGUF files below. `--dry-run` uses explicit development mode.
external_cmd = "llama-cli"
librarian_model = "gemma-2-2b-it-q4_k_m"
warden_model = "qwen2.5-coder-1.5b-q4_k_m"

# Pinned curator weights: model name -> sha256 of
# <data_dir>/weights/<model>/<sha>.gguf. Verified at boot and on
# `ultracortex curator verify-weights`. Uncomment to enable GGUF backends:
[curator.pinned]
librarian = "e0aee85060f168f0f2d8473d7ea41ce2f3230c1bc1374847505ea599288a7787"
warden = "0c3c38b9d1e2d6fa227b321b4d30ba921e1f7694a42a0ba207020cc58576fccc"

[observability]
# OTLP/HTTP JSON export is explicit and best-effort. Defaults target the
# conventional local OpenTelemetry Collector on port 4318.
otlp_enabled = true
otlp_metrics_endpoint = "http://127.0.0.1:4318/v1/metrics"
otlp_traces_endpoint = "http://127.0.0.1:4318/v1/traces"
otlp_logs_endpoint = "http://127.0.0.1:4318/v1/logs"
otlp_timeout_ms = 1000
